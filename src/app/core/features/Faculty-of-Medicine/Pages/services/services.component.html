<div class="container section">
  <!-- Service Title Section -->
  <div class="sector-header p-4 mb-4 rounded">
    <h1 class="text-brown">{{ service?.title || 'Loading data...' }}</h1>
  </div>

  <!-- Tabs -->
  <div class="medicine-tabs">
    <ul class="nav nav-tabs">
      <li class="nav-item">
        <button 
          class="nav-link" 
          [class.active]="activeTab === 'departments'"
          (click)="switchTab('departments')"
          type="button"
        >
          Service Details
        </button>
      </li>
    </ul>
  </div>

  <!-- Content Area -->
  <div class="row">
    <div *ngIf="activeTab === 'departments'" class="col-12">
      <div class="service-detail-card" *ngIf="service?.title || service?.description">
        <div class="service-detail-header">
          <h2>{{ service?.title }}</h2>
        </div>
        <div class="service-detail-body">
          <!-- Display description with table -->
          <div class="service-description" [innerHTML]="service?.description | cleanHtml:{ stripStyles: false, stripClasses: false } | safeHtml"></div>
        </div>
      </div>
      <div class="empty-state" *ngIf="!service?.title && !service?.description">
        <p>No information available.</p>
      </div>
    </div>
  </div>
</div>
