<div class="medicine-news-section" *ngIf="newsItems.length > 0">
  <!-- Section Header -->
  <div class="section-header" *ngIf="showTitle">
    <div class="container">
      <h2 class="section-title">{{ sectionTitle }}</h2>
    </div>
  </div>

  <!-- News Cards Grid -->
  <div class="container">
    <div class="news-grid three-columns">
      <article class="news-card"
               *ngFor="let item of visibleItems; trackBy: trackByFn"
               (click)="goToNewsDetails(item)">
        
        <div class="card-image">
          <img [src]="item.featuredImagePath" [alt]="item.title" loading="lazy">
          <div class="date-badge">
            <span class="day">{{ getDateParts(item.createdDate).day }}</span>
            <span class="month">{{ getDateParts(item.createdDate).month }}</span>
          </div>
          <span class="view-count-badge" *ngIf="item.totalViewCount !== undefined">
        {{ item.totalViewCount }}<i class="fas fa-eye me-1"></i>
      </span>
        </div>

        <div class="card-content">
          <h3 class="card-title">{{ item.title }}</h3>
          <p class="card-excerpt" [innerHTML]="item.content | cleanHtml | slice:0:250"></p>
           <div class="card-meta d-flex align-items-center gap-3 text-muted small mb-2">
            <span>
              <i class="fas fa-calendar-alt me-1"></i>
              {{ item.createdDate | date: 'yyyy/MM/dd' }}
            </span>
          </div>
          <a class="read-more">Read More<i class="fas fa-arrow-right" [class.fa-arrow-right]="!isRTL"></i></a>
        </div>
      </article>
    </div>
  </div>
</div>
